<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="Browser video call with live captions (not FaceTime). No app needed.">
<title>Video Call</title>
<style>
/* Tokens + primitives copied from app/src/ios.css; the .ft-* rules are app/src/screens/video.css verbatim.
   Keep both in sync so the host (React) and guest (this page) look identical. */
:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter Variable', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --sys-blue: #0a84ff; --sys-green: #30d158; --sys-red: #ff453a; --sys-orange: #ff9f0a; --sys-yellow: #ffd60a; --sys-indigo: #5e5ce6; --sys-teal: #64d2ff;
  --sys-gray: #8e8e93; --sys-gray2: #636366; --sys-gray3: #48484a;
  --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3);
  --material: rgba(30, 30, 32, .72);
  --ease: cubic-bezier(.32, .72, 0, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: var(--font); color: var(--label); -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
#ft { position: fixed; inset: 0; }
.ft button:focus-visible, .ft input:focus-visible { outline: 2px solid var(--sys-blue); outline-offset: 2px; }
@keyframes ios-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
/* ==========================================================================
   Video call (FaceTime-style layout, original styling, no Apple assets).
   Shared visual language with server/app/static/video.html (the guest page copies this file's rules
   verbatim, so keep the two in sync). Tokens come from ios.css (--material, --sys-*, --ease, --font).
   ========================================================================== */
.ft { position: relative; overflow: hidden; background: #000; color: #fff; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --chrome-h: 120px; --cap-scale: 1; --top-h: 64px; }
:where(.ft) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:where(.ft) svg { display: block; flex: none; }
:where(.ft) input { font: inherit; }

/* ---- video tiles: one is full-bleed (.big), the other is the floating picture-in-picture (.pip) */
.ft-stage { position: absolute; inset: 0; container-type: size; }
.ft-tile { position: absolute; left: 0; top: 0; overflow: hidden; background: #1c1c1e;
  transition: transform .3s var(--ease), width .3s var(--ease), height .3s var(--ease), border-radius .3s var(--ease), opacity .3s var(--ease); }
.ft-tile.big { width: 100%; height: 100%; border-radius: 0; z-index: 1; transform: none; }
.ft-tile.pip { z-index: 6; border-radius: 16px; cursor: grab; touch-action: none;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 .5px rgba(255,255,255,.18); }
.ft-tile.pip.dragging { transition: none; cursor: grabbing; }
.ft-tile.gone { opacity: 0; pointer-events: none; }
.ft-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
.ft-tile.self video { transform: scaleX(-1); }
.ft-tile .ft-backdrop { display: none; filter: blur(36px) brightness(.55) saturate(1.3); transform: scale(1.2); }
@container (min-aspect-ratio: 5/4) {
  .ft-tile.big.remote video.main { object-fit: contain; }
  .ft-tile.big.remote .ft-backdrop { display: block; }
}

/* camera off / audio only: a monogram on a soft gradient (like a contact card) */
.ft-off { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: radial-gradient(120% 80% at 50% 30%, #3a3d46 0%, #1b1c21 70%); text-align: center; }
.ft-tile.camoff .ft-off { display: flex; }
.ft-off .ft-avatar { width: 96px; height: 96px; font-size: 40px; }
.ft-off small { font: 500 15px/1.3 var(--font); color: var(--label-2); max-width: 80%; }
.ft-tile.pip .ft-off { gap: 4px; }
.ft-tile.pip .ft-off .ft-avatar { width: 44px; height: 44px; font-size: 18px; }
.ft-tile.pip .ft-off small { font-size: 11px; }
.ft-avatar { flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; text-transform: uppercase;
  background: linear-gradient(180deg, #a5abb8 0%, #858994 100%); width: 36px; height: 36px; font-size: 15px; letter-spacing: 0; }
.ft-avatar svg { width: 58%; height: 58%; }

/* small badges on a tile (remote muted) */
.ft-badge { position: absolute; top: 8px; left: 8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center;
  background: rgba(0,0,0,.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.ft-tile.micoff .ft-badge { display: grid; }
.ft-tile.big .ft-badge { top: calc(var(--safe-t) + var(--top-h) + 10px); left: 16px; width: 32px; height: 32px; }

/* mini caption on the picture-in-picture tile (host's own video on the host side) */
.ft-mini { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 2; padding: 4px 7px; border-radius: 9px; background: rgba(0,0,0,.62);
  font: 600 12px/1.25 var(--font); max-height: calc(2 * 1.25em + 8px); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  transition: opacity .3s var(--ease); }
.ft-mini.partial { font-style: italic; color: rgba(255,255,255,.75); }
.ft-mini.fading { opacity: 0; }
.ft-tile.big .ft-mini { display: none; }

/* ---- top chrome: name/status pill + round buttons */
.ft-top { position: absolute; z-index: 20; left: 12px; right: 12px; top: calc(var(--safe-t) + 12px); display: flex; align-items: flex-start; gap: 8px;
  transition: transform .3s var(--ease), opacity .3s var(--ease); }
.ft-pill { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 18px 8px 8px; border-radius: 26px; min-width: 0; max-width: 100%; }
.ft-pill .ft-avatar { width: 36px; height: 36px; }
.ft-pill .txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ft-pill b { font: 600 15px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ft-pill .txt > span { font: 400 13px/1.2 var(--font); color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.ft-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sys-orange); flex: none; animation: ios-pulse 1.4s ease-in-out infinite; }
.ft-dot.ok { background: var(--sys-green); animation: none; }
.ft-dot.bad { background: var(--sys-red); animation: none; }
.ft-spacer { flex: 1; }
.ft-round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; transition: background .2s var(--ease), transform .15s; }
.ft-round:active { transform: scale(.94); }
.ft-material { background: rgba(28,28,30,.62); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  box-shadow: 0 0 0 .5px rgba(255,255,255,.1) inset, 0 8px 24px rgba(0,0,0,.25); }

/* ---- bottom chrome: composer + control capsule */
.ft-bottom { position: absolute; z-index: 20; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 16px); display: flex; flex-direction: column;
  align-items: center; gap: 10px; transition: transform .3s var(--ease), opacity .3s var(--ease); }
.ft-capsule { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 40px; }
.ft-cbtn { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.16);
  transition: background .2s var(--ease), color .2s var(--ease), transform .15s; }
.ft-cbtn:active { transform: scale(.93); }
.ft-cbtn.off { background: #fff; color: #000; }          /* FaceTime: a white disc means "this is off" */
.ft-cbtn.lit { background: var(--sys-blue); }             /* a feature switched on (signing) */
.ft-cbtn.end { background: var(--sys-red); }
.ft-cbtn:disabled { opacity: .35; cursor: default; }
.ft.chrome-off .ft-top { transform: translateY(calc(-100% - 24px - var(--safe-t))); opacity: 0; pointer-events: none; }
.ft.chrome-off .ft-bottom > :not(.keep) { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
.ft-bottom > * { transition: transform .3s var(--ease), opacity .3s var(--ease); }

/* composer (host): iMessage-style field with a send arrow, plus the AI toggle */
.ft-compose { width: min(100%, 440px); display: flex; align-items: flex-end; gap: 8px; }
.ft-ai { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; transition: background .2s var(--ease), color .2s; }
.ft-ai.on { background: var(--sys-blue); box-shadow: none; }
.ft-field { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 6px; border-radius: 22px; padding: 4px 4px 4px 16px; }
.ft-field input { flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; background: none; color: #fff; font-size: 17px; }
.ft-field input::placeholder { color: rgba(235,235,245,.5); }
.ft .ft-field input:focus-visible { outline: none; }
.ft-field:focus-within { box-shadow: 0 0 0 1.5px rgba(10,132,255,.9) inset, 0 8px 24px rgba(0,0,0,.25); }
.ft-send { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sys-blue); color: #fff; flex: none;
  transition: opacity .2s, transform .2s var(--ease); }
.ft-send:disabled { opacity: 0; transform: scale(.6); pointer-events: none; }
.ft-send.busy { opacity: .6; }

/* AI suggestion chip */
.ft-suggest { width: min(100%, 440px); border-radius: 20px; padding: 12px 12px 12px 16px; display: flex; flex-direction: column; gap: 8px;
  animation: ft-rise .3s var(--ease); }
.ft-suggest .lbl { display: flex; align-items: center; gap: 6px; font: 600 12px var(--font); color: var(--sys-teal); letter-spacing: .01em; }
.ft-suggest .body { text-align: left; font: 600 17px/1.3 var(--font); color: #fff; min-height: 22px; }
.ft-suggest .body.wait { color: var(--label-2); font-weight: 500; font-style: italic; }
.ft-suggest .row { display: flex; gap: 8px; justify-content: flex-end; }
.ft-chipbtn { min-height: 36px; padding: 0 16px; border-radius: 18px; font: 600 15px var(--font); background: rgba(255,255,255,.14); color: #fff;
  display: inline-flex; align-items: center; gap: 6px; }
.ft-chipbtn.primary { background: var(--sys-blue); }
.ft-chipbtn.ghost { background: none; color: var(--sys-blue); }
.ft-x { width: 28px; height: 28px; margin: -6px -4px -6px 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); color: var(--label-2); }
.ft-chipbtn:disabled { opacity: .4; }

/* ---- live captions card (iOS Live Captions look) */
.ft-caption { position: absolute; z-index: 15; left: 12px; right: 12px; bottom: calc(var(--chrome-h) + var(--safe-b) + 28px); display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  pointer-events: none; transition: bottom .3s var(--ease); }
.ft.chrome-off .ft-caption { bottom: calc(var(--safe-b) + 20px); }
.ft-cap { width: min(100%, 600px); border-radius: 20px; padding: 10px 16px 13px; background: rgba(22,22,24,.74);
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 0 0 .5px rgba(255,255,255,.1) inset;
  transition: opacity .6s var(--ease), transform .3s var(--ease); animation: ft-rise .3s var(--ease); }
.ft-cap.fading { opacity: 0; transform: translateY(6px); }
.ft-cap .lbl { display: flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font); color: var(--label-2); margin-bottom: 6px; letter-spacing: .01em; }
.ft-cap .lbl svg { width: 15px; height: 15px; }
.ft-cap-text { font: 700 calc(clamp(20px, 5.6vw, 28px) * var(--cap-scale))/1.25 var(--font); letter-spacing: -0.015em;
  max-height: calc(2 * 1.25em); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; overflow-wrap: anywhere; }
.ft-cap.partial .ft-cap-text { color: rgba(255,255,255,.72); font-style: italic; font-weight: 600; }

/* signing indicator + "did you sign" picker */
.ft-signing { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 18px; font: 600 14px var(--font); animation: ft-fade .3s var(--ease); }
.ft-wave { display: flex; gap: 2px; align-items: center; height: 14px; }
.ft-wave i { width: 3px; border-radius: 2px; background: var(--sys-teal); animation: ft-bar 1s ease-in-out infinite; }
.ft-wave i:nth-child(1) { height: 6px; } .ft-wave i:nth-child(2) { height: 12px; animation-delay: .15s; } .ft-wave i:nth-child(3) { height: 8px; animation-delay: .3s; }
.ft-unsure { width: min(100%, 440px); border-radius: 20px; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; animation: ft-rise .3s var(--ease); }
.ft-unsure > span { width: 100%; font: 600 13px var(--font); color: var(--label-2); padding-left: 4px; }

/* ---- center overlays: invite card, waiting card, "tap to unmute" */
.ft-dim { position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,.42); pointer-events: none; animation: ft-fade .3s var(--ease); }
.ft-center { position: absolute; z-index: 12; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; pointer-events: none; }
.ft-card { pointer-events: auto; width: min(100%, 340px); border-radius: 26px; padding: 26px 20px 20px; display: flex; flex-direction: column; align-items: center;
  gap: 8px; text-align: center; background: rgba(28,28,30,.78); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow: 0 0 0 .5px rgba(255,255,255,.1) inset, 0 20px 60px rgba(0,0,0,.45); animation: ft-pop .4s var(--ease); }
.ft-card .ft-avatar { width: 64px; height: 64px; font-size: 26px; margin-bottom: 4px; }
.ft-card h2 { margin: 0; font: 700 22px/1.2 var(--font); letter-spacing: -0.02em; }
.ft-card p { margin: 0; font: 400 15px/1.35 var(--font); color: var(--label-2); }
.ft-card .ft-sub { font-size: 13px; margin-top: 4px; }
.ft-linkfield { width: 100%; margin-top: 8px; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-radius: 12px;
  background: rgba(118,118,128,.24); font: 400 15px var(--font); color: var(--label-2); }
.ft-linkfield span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; user-select: all; -webkit-user-select: all; }
.ft-linkfield button { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--sys-blue); }
.ft-bigbtn { width: 100%; min-height: 50px; border-radius: 14px; margin-top: 6px; font: 600 17px var(--font); display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; background: var(--sys-blue); color: #fff; transition: opacity .2s, transform .15s; }
.ft-bigbtn:active { opacity: .75; transform: scale(.98); }
.ft-bigbtn.green { background: var(--sys-green); color: #fff; }
.ft-bigbtn.gray { background: rgba(118,118,128,.28); color: #fff; }
.ft-bigbtn.plain { background: none; color: var(--sys-blue); min-height: 44px; margin-top: 0; }
.ft-bigbtn:disabled { opacity: .45; }
.ft-spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.22); border-top-color: #fff; animation: ft-spin .9s linear infinite; }
.ft-unmute { position: absolute; z-index: 25; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 20px; border-radius: 24px; font: 600 16px var(--font); animation: ft-pop .4s var(--ease); }

/* toast + banner under the top pill */
.ft-toast { position: absolute; z-index: 40; left: 50%; top: calc(var(--safe-t) + var(--top-h) + 20px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 22px; font: 600 14px var(--font); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  animation: ft-drop .35s var(--ease); pointer-events: none; }
.ft-toast svg { color: var(--sys-green); }
.ft-banner { position: absolute; z-index: 19; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + var(--top-h) + 20px); width: max-content; max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 18px; font: 600 13px/1.3 var(--font); color: #ffd18a; animation: ft-drop .35s var(--ease); }

/* ---- full-screen states: pre-join, permission, full, ended */
.ft-panel { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px); text-align: center; background: radial-gradient(120% 70% at 50% 0%, #22252e 0%, #000 70%);
  animation: ft-fade .3s var(--ease); overflow-y: auto; }
.ft-panel.over { background: rgba(0,0,0,.55); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
.ft-panel h2 { margin: 6px 0 0; font: 700 26px/1.15 var(--font); letter-spacing: -0.025em; }
.ft-panel p { margin: 0; max-width: 340px; font: 400 15px/1.4 var(--font); color: var(--label-2); }
.ft-panel .ft-actions { width: min(100%, 320px); display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.ft-panel .ft-actions.row { flex-direction: row; }
.ft-panel .ft-actions.row > * { flex: 1; margin-top: 0; }
.ft-glyph { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,69,58,.16); color: var(--sys-red); margin-bottom: 4px; }
.ft-glyph.blue { background: rgba(10,132,255,.16); color: var(--sys-blue); }
.ft-glyph.orange { background: rgba(255,159,10,.16); color: var(--sys-orange); }
.ft-steps { width: min(100%, 340px); margin: 10px 0 0; padding: 0; list-style: none; border-radius: 14px; background: rgba(118,118,128,.16); text-align: left; counter-reset: s; }
.ft-steps li { position: relative; padding: 12px 14px 12px 48px; font: 400 15px/1.35 var(--font); color: var(--label); counter-increment: s; }
.ft-steps li + li { box-shadow: 0 -.5px 0 rgba(84,84,88,.6); }
.ft-steps li::before { content: counter(s); position: absolute; left: 14px; top: 11px; width: 22px; height: 22px; border-radius: 50%; background: var(--sys-blue);
  font: 600 13px/22px var(--font); text-align: center; color: #fff; }
.ft-ended .ft-avatar { width: 96px; height: 96px; font-size: 40px; }
.ft-ended .dur { font: 400 17px var(--font); color: var(--label-2); font-variant-numeric: tabular-nums; }

/* guest pre-join: own camera behind a bottom card */
.ft-prejoin { position: absolute; inset: 0; z-index: 30; background: #000; }
.ft-prejoin video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.ft-prejoin .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: 260px;
  background: radial-gradient(120% 70% at 50% 0%, #2a2d36 0%, #000 72%); color: var(--label-2); font: 400 15px var(--font); }
.ft-prejoin .ph .ft-avatar { width: 112px; height: 112px; font-size: 46px; }
.ft-joincard { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 16px); margin: 0 auto; width: min(calc(100% - 24px), 420px); border-radius: 28px;
  padding: 22px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; animation: ft-rise .45s var(--ease); }
.ft-joincard .who { font: 400 15px var(--font); color: var(--label-2); }
.ft-joincard h1 { margin: 0; font: 700 26px/1.15 var(--font); letter-spacing: -0.025em; }
.ft-joincard .toggles { display: flex; gap: 14px; margin: 10px 0 4px; }
.ft-joincard .ft-bigbtn { margin-top: 8px; }
.ft-joincard small { font: 400 13px/1.35 var(--font); color: var(--label-2); margin-top: 4px; }

/* ---- options (iOS action sheet) */
.ft-scrim { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center;
  padding: 0 8px calc(var(--safe-b) + 8px); animation: ft-fade .25s var(--ease); }
.ft-sheet { width: min(100%, 430px); display: flex; flex-direction: column; gap: 8px; animation: ft-up .38s var(--ease); }
.ft-group { border-radius: 14px; overflow: hidden; background: rgba(44,44,46,.86); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); }
.ft-group .head { padding: 14px 16px 10px; font: 600 13px var(--font); color: var(--label-2); text-align: center; box-shadow: 0 .5px 0 rgba(84,84,88,.6); }
.ft-row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-align: left; font: 400 17px var(--font); color: #fff; position: relative; }
.ft-row + .ft-row::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: rgba(84,84,88,.6); }
.ft-row .grow { flex: 1; min-width: 0; }
.ft-row .grow small { display: block; font-size: 13px; color: var(--label-2); margin-top: 2px; line-height: 1.3; }
.ft-row .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--sys-blue); }
.ft-row .ico.teal { background: #0a9fbf; } .ft-row .ico.indigo { background: var(--sys-indigo); } .ft-row .ico.gray { background: var(--sys-gray2); }
.ft-row.link { justify-content: center; color: var(--sys-blue); }
.ft-row.cancel { justify-content: center; font-weight: 600; color: var(--sys-blue); }
.ft-switch { position: relative; width: 51px; height: 31px; flex: none; }
.ft-switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.ft-switch span { position: absolute; inset: 0; border-radius: 16px; background: rgba(120,120,128,.36); transition: background .25s var(--ease); pointer-events: none; }
.ft-switch span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.15); transition: transform .25s var(--ease); }
.ft-switch input:checked + span { background: var(--sys-green); }
.ft-switch input:checked + span::after { transform: translateX(20px); }
.ft-switch input:focus-visible + span { outline: 2px solid var(--sys-blue); outline-offset: 2px; }
.ft-stepper { display: flex; border-radius: 9px; background: rgba(118,118,128,.24); flex: none; }
.ft-stepper button { width: 50px; height: 36px; display: grid; place-items: center; font: 600 15px var(--font); }
.ft-stepper button + button { box-shadow: -.5px 0 0 rgba(84,84,88,.9); }
.ft-stepper button:disabled { opacity: .35; }

.ft.has-panel .ft-top, .ft.has-panel .ft-bottom, .ft.has-panel .ft-caption, .ft.has-panel .ft-center, .ft.has-panel .ft-dim { display: none; }
.ft .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes ft-fade { from { opacity: 0; } }
@keyframes ft-rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes ft-pop { from { opacity: 0; transform: scale(.94); } }
@keyframes ft-up { from { transform: translateY(100%); } }
@keyframes ft-drop { from { opacity: 0; transform: translate(-50%, -12px); } }
@keyframes ft-spin { to { transform: rotate(360deg); } }
@keyframes ft-bar { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1.2); } }

/* very small phones (360 wide and below) */
@media (max-width: 370px) {
  .ft-capsule { gap: 8px; padding: 8px; }
  .ft-cbtn { width: 48px; height: 48px; }
  .ft-pill { padding-right: 14px; }
  .ft-card { padding: 22px 16px 16px; }
}
/* short landscape phones: keep everything visible */
@media (max-height: 500px) {
  .ft-card { padding: 14px 16px 14px; gap: 4px; }
  .ft-card .ft-avatar { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ft *, .ft *::before, .ft *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

    <span class="ft-spacer"></span>
    <button class="ft-round ft-material" id="shareBtn" aria-label="Copy invite link" hidden><i data-icon="share" data-size="21"></i></button>

      <div class="ft-cap-text"><span id="capText"></span></div>

  </div>

  <div class="ft-bottom" id="bottom">

      <label class="ft-field ft-material">
        <span class="sr">Type a caption</span>

      </label>
    </form>
    <div class="ft-capsule ft-material" role="toolbar" aria-label="Call controls">
      <button class="ft-cbtn" id="muteBtn" aria-label="Mute microphone" aria-pressed="false"><i data-icon="mic" data-size="24"></i></button>
      <button class="ft-cbtn" id="camBtn" aria-label="Turn camera off" aria-pressed="false"><i data-icon="video" data-size="24"></i></button>
      <button class="ft-cbtn" id="capsBtn" aria-label="Hide captions" aria-pressed="true"><i data-icon="captions" data-size="24"></i></button>
      <button class="ft-cbtn end" id="endBtn" aria-label="End call"><i data-icon="phoneDown" data-size="28"></i></button>
    </div>
  </div>

  <div class="ft-scrim" id="sheet" hidden>
    <div class="ft-sheet" role="dialog" aria-label="Call options">
      <div class="ft-group">
        <div class="head">Call Options</div>
        <label class="ft-row">
          <span class="ico"><i data-icon="captions" data-size="18"></i></span>
          <span class="grow">Live Captions<small id="capsNote">Shows what they sign or type, over their video.</small></span>
          <span class="ft-switch"><input type="checkbox" role="switch" id="capsSwitch" checked aria-label="Show live captions"><span></span></span>
        </label>
        <div class="ft-row">
          <span class="ico gray"><i data-icon="textSize" data-size="18"></i></span>

        </div>
        <button class="ft-row" id="copyRow" hidden>
          <span class="ico teal"><i data-icon="link" data-size="18"></i></span>
          <span class="grow">Copy invite link<small id="copyRowUrl"></small></span>
        </button>
      </div>
      <div class="ft-group"><button class="ft-row cancel" id="sheetDone">Done</button></div>
    </div>
  </div>

  <div class="ft-prejoin" id="prejoin">

    <div class="ph" id="previewPh"><span class="ft-avatar av-me" aria-hidden="true"></span><span id="phText">Your camera turns on when you join.</span></div>
    <div class="ft-joincard ft-material" role="dialog" aria-labelledby="joinH">

      <div class="toggles">
        <button class="ft-cbtn" id="preMic" aria-label="Join with microphone off" aria-pressed="false"><i data-icon="mic" data-size="24"></i></button>

      <button class="ft-bigbtn plain" id="joinNoCam">Join without camera</button>
      <small id="joinNote">Live captions appear over their video. No app or sign-up.</small>
    </div>
  </div>

  <div class="ft-panel" id="panel" hidden></div>
</div>

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inviteUrl).then(ok, fallback); else fallback();
  }
  function shareLink() {
    if (canShare()) {
      navigator.share({ title: 'Video call', text: myName ? myName + ' is inviting you to a video call' : 'Join my video call', url: inviteUrl })
        .catch(function (e) { if (!e || e.name !== 'AbortError') copyLink(); });
    } else copyLink();
  }
  $('shareBtn').onclick = shareLink;
  $('copyRow').onclick = function () { S.sheet = false; render(); copyLink(); };
  if (isHost) $('shareBtn').setAttribute('aria-label', canShare() ? 'Share invite link' : 'Copy invite link');

  // delegated buttons inside cards/panels
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'copy') copyLink();
    else if (a === 'share') shareLink();
    else if (a === 'retry') { panel(''); $('prejoin').hidden = false; renderPrejoin(); join(false); }
    else if (a === 'nocam') { panel(''); join(true); }
    else if (a === 'rejoin') { panel(''); $('panel').classList.remove('ft-ended'); stopped = true; $('prejoin').hidden = false; S.conn = 'idle'; render(); precheck(); }
    else if (a === 'close') { try { window.close(); } catch (x) {} setTimeout(function () { var n = document.querySelector('.closed-note'); if (n) n.hidden = false; }, 300); }
  });

  // host mode: typed captions (sent exactly)
  var inp = $('capInput'), lastPartial = 0;
  function pushCaption(t, final) { showCaption(t, final, 'typed'); send({ type: 'caption', text: t, final: final, src: 'typed' }); }
  inp.addEventListener('input', function () {
    $('capSend').disabled = !inp.value.trim();
    if (!inp.value.trim()) { pushCaption('', false); render(); return; }
    var now = Date.now(); if (now - lastPartial < 120) return; lastPartial = now;
    pushCaption(inp.value, false);
  });
  inp.addEventListener('focus', function () { S.typing = true; render(); });
  inp.addEventListener('blur', function () { S.typing = false; render(); wake(); });
  $('compose').onsubmit = function (e) {
    e.preventDefault();
    var t = inp.value.trim(); if (!t) return;
    pushCaption(t, true); inp.value = ''; $('capSend').disabled = true; render();
  };

  // ---------------------------------------------------------------- network + tab visibility
  window.addEventListener('online', function () { S.online = true; render(); reconnectNow(); });
  window.addEventListener('offline', function () { S.online = false; render(); });
  document.addEventListener('visibilitychange', function () {
    sendState();
    if (!document.hidden) {
      localEl.play().catch(function () {}); remoteEl.play().catch(function () {}); backdropEl.play().catch(function () {});
      reconnectNow();
      if (S.conn === 'connected') $('pillStatus').textContent = fmt(Date.now() - S.startedAt);
    }
  });
  window.addEventListener('pagehide', function () { if (!stopped) send({ type: 'bye', role: isHost ? 'host' : 'guest' }); });

  render();
  precheck();
})();
</script>
</body>
</html>
