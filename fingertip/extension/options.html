<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fingertip Meeting Captions settings</title>
  <style>
    body{font:16px/1.45 system-ui,sans-serif;margin:0;background:#f4f5fb;color:#15192a}.card{max-width:560px;margin:48px auto;padding:28px;
    background:#fff;border-radius:20px;box-shadow:0 16px 50px rgba(27,31,63,.1)}h1{font-size:24px;margin:0 0 6px}p{color:#596078}
    label{display:block;font-weight:700;margin:22px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #cbd0df;
    border-radius:11px;font:16px system-ui}button{margin-top:14px;padding:11px 18px;border:0;border-radius:11px;background:#6256ff;color:white;font-weight:750;
    cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #aba5ff;outline-offset:2px}#status{min-height:24px;font-size:14px}
    .note{font-size:13px;background:#eef0f8;padding:12px;border-radius:10px}
  </style>
</head>
<body><main class="card">
  <h1>Fingertip Meeting Captions</h1>
  <p>Use the same server address as the Sign2Speak/Fingertip web app.</p>
  <label for="server">Server origin</label>
  <input id="server" type="url" placeholder="https://your-server.example.com" autocomplete="url">
  <button id="save" type="button">Save and allow this server</button>
  <p id="status" role="status"></p>
  <p class="note">Supported pages: Google Meet and Zoom Web. Captions are local by default. The extension does not support Zoom Desktop,
    native FaceTime, or guaranteed remote caption delivery.</p>
</main><script src="options.js"></script></body>
</html>
